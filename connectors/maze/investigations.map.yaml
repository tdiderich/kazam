mapping: maze-investigations
version: 0.3.0

source:
  spec: maze-api.json
  api_version: 0.7.0
  base_url: "{{MAZE_API_URL}}"
  auth:
    type: api_key
    header: X-API-Key
    value: "{{MAZE_API_KEY}}"

output:
  target: curata
  slug: maze-exposure
  mode: upsert
  folder: connectors

semantics:
  - ".maze_severity is Maze's own score, not CVSS. .snapshot.cvss carries the scanner-comparable number. Never present them as the same scale."
  - ".exploitability has two values - exploitable, not_exploitable. The API folds 'cannot determine' into not_exploitable per the spec description."
  - ".investigation_steps[].proofs[].raw_output_in_markdown is evidence. Render verbatim, never re-summarize."
  - ".snapshot_status tracks finding lifecycle: open, investigating, closed. Updated by users or automation independently of the investigation pipeline. Null when no status has been recorded; defaults to open."
  - ".snapshot_status_reason records the reason for the most recent status transition."

pulls:
  investigations:
    request:
      method: POST
      path: /v1/investigations/search
      body:
        updated_from: "{{last_sync}}"
        limit: 100
    paginate:
      style: cursor
      next_from: .next_cursor
      while: .has_more
    collect: .data[]
    rate_limit:
      strategy: retry_after
      max_retries: 3
      backoff: exponential
    transforms:
      - lowercase: .maze_severity
      - lowercase: .exploitability
      - default: .snapshot.status
        value: "open"
        when: missing
      - lowercase: .snapshot.status
      - rename: .snapshot.status
        to: .snapshot_status
      - rename: .snapshot.status_reason
        to: .snapshot_status_reason
      - strip: .related_scanner_findings[].asset_name
        before_last: "/"
      - strip: .related_scanner_findings[].asset_name
        after_first: "@"
      - strip: .related_scanner_findings[].asset_name
        after_first: ":"

personas:
  board:
    question: "How much noise has Maze removed? How many real issues remain? Are findings getting closed?"
  ciso:
    question: "Which assets carry the most real risk? Where are we making progress on remediation?"
  remediator:
    question: "What should I fix first, and on which asset? What's already been handled?"

shapes:
  exploitability_counts:
    pull: investigations
    aggregate:
      - tally:
          where: .exploitability = "not_exploitable"
          as: noise
      - tally:
          where: .exploitability = "exploitable"
          as: exploitable
      - tally:
          where: .maze_severity
          in: [critical, high]
          as: crit_high
      - tally:
          where: .snapshot_status
          in: [closed]
          as: closed
      - tally:
          all: true
          as: total
      - derive:
          name: noise_pct
          expr: noise / total * 100
      - derive:
          name: closed_pct
          expr: closed / total * 100
    persona: board
    decided: true

  closure_crit_high:
    pull: investigations
    aggregate:
      - filter:
          where: .maze_severity
          in: [critical, high]
      - tally:
          all: true
          as: total_crit_high
      - tally:
          where: .snapshot_status
          in: [closed]
          as: closed_crit_high
      - tally:
          where: .snapshot_status
          in: [open, investigating]
          as: open_crit_high
      - derive:
          name: closed_pct
          expr: closed_crit_high / total_crit_high * 100
      - derive:
          name: open_pct
          expr: open_crit_high / total_crit_high * 100
    persona: board
    decided: true

  closure_rate:
    pull: investigations
    aggregate:
      - tally:
          all: true
          as: total
      - tally:
          where: .snapshot_status
          in: [closed]
          as: closed
      - tally:
          where: .snapshot_status
          in: [investigating]
          as: investigating
      - tally:
          where: .snapshot_status
          in: [open]
          as: open
      - derive:
          name: closed_pct
          expr: closed / total * 100
      - derive:
          name: investigating_pct
          expr: investigating / total * 100
      - derive:
          name: open_pct
          expr: open / total * 100
    persona: board, ciso
    decided: true

  closure_by_severity:
    pull: investigations
    aggregate:
      - bucket:
          by: [.maze_severity]
          ordered: [critical, high, medium, low, not_exploitable]
      - tally:
          all: true
          as: total
      - tally:
          where: .snapshot_status
          in: [closed]
          as: closed
      - tally:
          where: .snapshot_status
          in: [open]
          as: open
      - tally:
          where: .snapshot_status
          in: [investigating]
          as: investigating
      - derive:
          name: closed_pct
          expr: closed / total * 100
    persona: ciso
    decided: true

  severity_shift:
    pull: investigations
    aggregate:
      - bucket:
          by: [.maze_severity]
          ordered: [critical, high, medium, low, not_exploitable]
      - tally:
          all: true
          as: maze_count
      - expand: .related_scanner_findings[]
      - bucket:
          by: [.severity]
          ordered: [critical, high, medium, low]
      - tally:
          all: true
          as: scanner_count
      - compare:
          a: scanner_count
          b: maze_count
          op: subtract
          as: shift
    persona: board
    decided: true

  per_asset_risk:
    pull: investigations
    aggregate:
      - expand: .related_scanner_findings[]
      - bucket:
          by: [.asset_name, .asset_type]
      - tally:
          where: .exploitability = "exploitable"
          as: exploitable
      - tally:
          where: .maze_severity
          in: [critical, high]
          as: crit_high
      - tally:
          where: .severity
          in: [critical, high, medium]
          as: scanner_actionable
      - tally:
          where: .maze_severity
          in: [critical, high, medium]
          as: maze_actionable
      - derive:
          name: noise_reduction
          expr: 1 - maze_actionable / scanner_actionable
      - rank:
          by: [crit_high, exploitable]
          direction: [desc, desc]
      - take: 10
    persona: ciso
    decided: true

  scanner_coverage:
    pull: investigations
    conditional: distinct(.related_scanner_findings[].scanner) >= 2
    aggregate:
      - expand: .related_scanner_findings[]
      - distinct: .scanner
      - tally:
          all: true
          as: finding_count
    persona: ciso
    decided: true

  remediation_queue:
    pull: investigations
    aggregate:
      - filter:
          where: .maze_severity
          in: [critical, high]
      - expand: .related_scanner_findings[]
      - rank:
          by: .maze_severity
          order: [critical, high]
      - rank:
          by: .cve_id
          direction: asc
      - take: 20
    persona: remediator
    decided: true

sections:
  exposure-program-progress:
    shape: exploitability_counts
    component: progress_bar
    config:
      bars:
        - label: "Noise eliminated"
          value: noise_pct
          detail: "{{noise}} of {{total}} findings marked not exploitable"
          color: green
          thresholds: { 50: yellow, 80: green }
        - label: "Findings closed"
          value: closed_pct
          detail: "{{closed}} of {{total}} findings closed"
          color: blue
          thresholds: { 25: red, 50: yellow, 75: green }

  exposure-crit-high-closure:
    shape: closure_crit_high
    component: progress_bar
    config:
      bars:
        - label: "Critical + High resolution"
          value: closed_pct
          detail: "{{closed_crit_high}} closed / {{open_crit_high}} open of {{total_crit_high}} critical/high findings"
          color: green
          thresholds: { 25: red, 50: yellow, 80: green }

  exposure-closure-rate:
    shape: closure_rate
    component: stat_grid
    config:
      columns: 3
      stats:
        - label: "Closed"
          value: "{{closed}} ({{closed_pct}}%)"
          color: green
        - label: "Investigating"
          value: "{{investigating}} ({{investigating_pct}}%)"
          color: yellow
        - label: "Open"
          value: "{{open}} ({{open_pct}}%)"
          color: red

  exposure-closure-by-severity:
    shape: closure_by_severity
    component: table
    config:
      filterable: true
      columns:
        - key: severity
          label: Severity
          color_map:
            critical: red
            high: red
            medium: yellow
            low: default
            not_exploitable: green
        - key: total
          label: Total
          align: right
        - key: closed
          label: Closed
          align: right
        - key: open
          label: Open
          align: right
        - key: investigating
          label: Investigating
          align: right
        - key: closed_pct
          label: "% Closed"
          align: right
          sortable: true

  exposure-severity-shift:
    shape: severity_shift
    component: split_compare
    config:
      left: { title: "Scanner View", eyebrow: "BEFORE MAZE" }
      right: { title: "Maze View", eyebrow: "AFTER INVESTIGATION" }

  exposure-asset-risk:
    shape: per_asset_risk
    component: table
    config:
      filterable: true
      columns:
        - key: asset
          label: Asset
        - key: type
          label: Type
        - key: total
          label: Total
        - key: exploitable
          label: Exploitable
          sortable: true
        - key: crit_high
          label: Crit+High
          sortable: true
        - key: noise_reduction
          label: Noise Reduction
          sortable: true

  exposure-per-asset-shift:
    shape: per_asset_risk
    component: before_after
    config:
      slice: take 3
      before: "{{scanner_actionable}} actionable findings (scanner)"
      after: "{{maze_actionable}} actionable findings (after Maze)"

  exposure-scanner-overlap:
    shape: scanner_coverage
    component: venn
    config:
      labels: "{{scanner}} ({{finding_count}})"

  exposure-remediation-queue:
    shape: remediation_queue
    component: table
    config:
      filterable: true
      columns:
        - key: cve_id
          label: CVE
        - key: asset
          label: Asset
        - key: maze_severity
          label: Maze Severity
          color_map:
            critical: red
            high: red
            medium: yellow
        - key: scanner_severity
          label: Scanner Severity
          color_map:
            critical: red
            high: red
            medium: yellow
        - key: snapshot_status
          label: Status
          color_map:
            closed: green
            investigating: yellow
            open: red
        - key: snapshot_status_reason
          label: Reason
