name: Release

on:
  push:
    branches:
      - main

jobs:
  build-linux:
    name: Build linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target x86_64-unknown-linux-gnu

      - name: Rename binary
        run: cp target/x86_64-unknown-linux-gnu/release/kazam kazam-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazam-linux-amd64
          path: kazam-linux-amd64

  build-macos:
    name: Build darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/kazam kazam-darwin-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kazam-darwin-arm64
          path: kazam-darwin-arm64

  release:
    name: Publish release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: kazam-linux-amd64

      - name: Download macos artifact
        uses: actions/download-artifact@v4
        with:
          name: kazam-darwin-arm64

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "latest" \
            --notes "Built from main branch commit ${{ github.sha }}" \
            kazam-linux-amd64 \
            kazam-darwin-arm64
