- id: kz-cd9e
  title: Prompt-as-code — version-controlled agent prompts in repo
  status: closed
  priority: 2
  task_type: task
  note: 'Store agent system prompts as YAML in a prompts/ directory convention. Schema: name, description, model (optional), system_prompt, tools (optional list). Version-controlled alongside content — prompt changes go through same Git review flow. MCP server exposes list_prompts and get_prompt tools so agents always pull latest instructions from repo. kazam validate covers prompt files. Like skills but context-aware — prompts can reference the site''s voice config, component schemas, and content structure.'
  created: 2026-05-02T20:23:59.491408-05:00
  updated: 2026-05-02T21:01:18.194153-05:00
  closed: 2026-05-02T21:01:18.194153-05:00
  close_reason: kazam prompt list/show/init with prompts/ directory
- id: kz-8a96
  title: GitHub Action templates — CI hooks that invoke prompt templates
  status: closed
  priority: 2
  task_type: task
  note: 'Pre-built GitHub Actions that trigger kazam prompt templates on repo events. Examples: on PR merge → run a prompt template to update relevant docs, on schedule (weekly) → kazam freshness posts drift report to an issue, on push → kazam validate as CI linter. Replaces kazam wish as the ingestion mechanism — prompts define what to do, actions define when. Low effort (templated YAML), first concrete ingestion hook from Company Brain plan. Depends on prompt-as-code (kz-cd9e) landing first.'
  created: 2026-05-02T20:25:53.811227-05:00
  updated: 2026-05-02T21:01:18.199276-05:00
  closed: 2026-05-02T21:01:18.199276-05:00
  close_reason: kazam actions list/init for GH workflow templates
- id: kz-39a9
  title: Concurrent write protection — MCP server page locking
  status: closed
  priority: 2
  task_type: task
  note: 'MCP server acquires per-page lock before writing, releases after commit. If another agent targets the same page, server queues or rejects with clear message (page X being edited by agent Y, retry in N seconds). Goal: hide Git merge conflicts from users entirely — kazam handles concurrency so customers never think about it. Start with in-memory lock table in MCP server process (single-server case). Upgrade to file-based or distributed lock if/when multiple MCP server instances needed. No user-facing LOCK.yaml file.'
  created: 2026-05-02T20:27:30.067225-05:00
  updated: 2026-05-02T20:28:07.873316-05:00
  closed: 2026-05-02T20:28:07.873316-05:00
  close_reason: Dropped — CI serializes writes via PR flow, Git conflict resolution + agent retry is sufficient. No custom locking needed.
- id: kz-d3f5
  title: Page references + ownership — link content back to sources
  status: closed
  priority: 2
  task_type: task
  note: 'Optional references array in page YAML: each entry has url and note (e.g. PR link, Slack thread, meeting notes). Optional owner field (string) for who is responsible for the page. References rendered as Sources section on the page. Agents append to references automatically when editing via MCP. kazam freshness can report pages with no owner. Goal: when someone reads a page and asks ''why is it this way?'' the breadcrumbs are right there. Replaces the original provenance metadata idea — Git blame handles who/when, references handle why/where.'
  created: 2026-05-02T20:29:51.222042-05:00
  updated: 2026-05-02T21:01:18.204371-05:00
  closed: 2026-05-02T21:01:18.204371-05:00
  close_reason: Page.owner + Page.references with rendered references section
