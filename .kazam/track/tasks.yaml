  title: Global voice configuration — brand voice rules in site config
  status: closed
  priority: 2
  task_type: task
  note: 'Add voice section to site config YAML. Fields: tone (string), reading_level (string), terminology.prefer (map of replacements), terminology.avoid (list of banned terms). Included in agent system prompts automatically when authoring content. Config only for now — enforcement/linting against voice rules is a follow-on. Ensures consistent output across multiple agent and human authors.'
  created: 2026-05-02T20:22:35.711469-05:00
  updated: 2026-05-02T21:01:18.188337-05:00
  closed: 2026-05-02T21:01:18.188337-05:00
