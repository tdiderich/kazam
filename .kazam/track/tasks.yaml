  title: /refresh prompt template — autonomous freshness loop
  status: closed
  priority: 1
  task_type: task
  note: 'Prompt template: prompts/refresh.yaml. Flow: kazam freshness --json → filter pages stale by X days → for each, pull sources_of_truth via MCPs (Slack, GitHub, Granola) → diff against current page content → propose updates as PR. Uses: freshness.updated for staleness, freshness.sources_of_truth for where to look, freshness.owner for who to ping, MCP server for read/write, agent MCPs for real-world context. Can run as weekly GitHub Action for autonomous freshness. This is the retainer value engine. Depends on: freshness (kz-89cc), MCP server (kz-2e1b), prompt-as-code (kz-cd9e), references (kz-d3f5).'
