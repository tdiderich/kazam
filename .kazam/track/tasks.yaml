- id: kz-2e1b
  title: MCP Server — embed stdio MCP server in kazam binary
  status: closed
  priority: 1
  task_type: task
  note: 'Subcommand: kazam mcp. Transport: stdio (subprocess model for Claude Desktop/Cursor). Read-only tools first: read_page, list_pages, search, get_config. Write tools gated behind --allow-writes flag (validate → write → commit). Operates on single site (cwd). JSON-schema descriptions on every tool for agent self-discovery. Dependency: schema validation should land first for write_page self-correction, but read-only server can ship independently.'
  created: 2026-05-02T20:16:08.635537-05:00
  updated: 2026-05-02T21:01:25.282770-05:00
  closed: 2026-05-02T21:01:25.282770-05:00
  close_reason: MCP server merged — stdio JSON-RPC 2.0 with read/write tools
- id: kz-1aad
  title: site.json manifest — emit structured page index during build
  status: closed
  priority: 1
  task_type: task
  note: 'During kazam build, emit _site/site.json alongside HTML. Contents per page: path, title, description, tags, last_updated, component types used. Turns static site into a headless API any agent can query over plain HTTP. Universal fallback for agents that don''t speak MCP. Also powers future drift dashboard. Optional --no-manifest flag to skip. Schema should be stable and documented. JSON not YAML — it''s an output contract, not an authoring surface.'
  created: 2026-05-02T20:16:49.908191-05:00
  updated: 2026-05-02T21:01:25.289895-05:00
  closed: 2026-05-02T21:01:25.289895-05:00
  close_reason: site.json manifest emitted during build, --no-manifest flag
- id: kz-8405
  title: JSON build output — kazam build --json flag
  status: closed
  priority: 1
  task_type: task
  note: 'Add --json flag to kazam build. Emits NDJSON (one JSON object per line) to stdout instead of human-readable output. Event types: build_start, page_built, page_error, warning, build_complete (with summary stats). Human output remains default. Follows convention of gh/docker/kubectl. Enables CI/CD orchestrators and agent loops to parse build results programmatically without regex.'
  created: 2026-05-02T20:17:52.887360-05:00
  updated: 2026-05-02T21:01:30.154201-05:00
  closed: 2026-05-02T21:01:30.154201-05:00
  close_reason: NDJSON build output flag merged
- id: kz-3a92
  title: Strict YAML schema validation — kazam validate command
  status: closed
  priority: 1
  task_type: task
  note: 'Deep validation of page YAML against site''s component schemas. Two surfaces: standalone kazam validate subcommand (JSON output by default, --pretty for human-readable) and integrated into kazam build (errors fail build, warnings don''t). Error format: JSON with file, line, path (YAML keypath like sections[2].items[0].label), error_type, message, suggestion. Suggestion field enables agent self-correction loop. Validates: required fields per component type, value types, enum constraints, structural rules. Schema derived from existing component registry — no separate schema files. Foundation for MCP write_page tool.'
  created: 2026-05-02T20:18:12.960455-05:00
  updated: 2026-05-02T21:01:30.162326-05:00
  closed: 2026-05-02T21:01:30.162326-05:00
  close_reason: kazam validate subcommand with component schema validation
- id: kz-d46c
  title: Built-in static search index — search.json emission during build
  status: closed
  priority: 1
  task_type: task
  note: 'During kazam build, emit _site/search.json — a lightweight inverted index. Sources per page: title, description, headings, content snippets, and author-provided search_terms array from page YAML frontmatter. search_terms lets authors add aliases/acronyms/jargon that don''t appear in rendered content. Zero external dependencies — no Pagefind, keeps single-binary promise. MCP search tool and client-side JS widget both consume the same search.json. Optional --no-search flag to skip. Simple JS search widget available as a kazam component.'
  created: 2026-05-02T20:20:21.007539-05:00
  updated: 2026-05-02T21:01:18.172778-05:00
  closed: 2026-05-02T21:01:18.172778-05:00
  close_reason: search.json integrated into build pipeline with --no-search flag
- id: kz-89cc
  title: Freshness field + decay metrics command
  status: closed
  priority: 1
  task_type: task
  note: 'Optional freshness field in page YAML. Valid values: a date (e.g. freshness: 2026-05-02) or "never". Default when omitted: "never" (no breaking change). Build emits a warning for pages missing freshness to nudge authors toward setting it. "never" pages skip decay checks, excluded from kazam freshness reports, shown separately in drift dashboard. Add kazam freshness command: reports pages past configurable threshold (freshness_days in site config, default 90). JSON output by default, --pretty for humans. Per-page freshness and days_since_update included in site.json manifest. Powers drift dashboard for the retainer business model.'
  created: 2026-05-02T20:21:15.027327-05:00
  updated: 2026-05-02T21:01:18.181720-05:00
  closed: 2026-05-02T21:01:18.181720-05:00
  close_reason: FreshnessValue enum with never opt-out, kazam freshness subcommand
