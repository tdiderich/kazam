- id: kz-c537
  symptom: 'gh CLI in curata-app resolves to tdiderich/curata instead of tdiderich/curata-app (gh repo view returns the wrong repo despite origin being correct). Any gh command run there without --repo hits the wrong repository, including pr merge. Fix: gh repo set-default tdiderich/curata-app'
  file_path: curata-app
  resolution: 'Root cause was not misconfiguration: curata-app has two remotes (origin=curata-app, upstream=curata) and gh prefers upstream over origin by design for fork workflows. curata-app is an overlay with unrelated history, not a fork, so the default resolved to the OSS repo. Fixed with ''gh repo set-default tdiderich/curata-app'', which writes remote.origin.gh-resolved=base to local git config. Verified gh run list now returns curata-app runs. curata, kazam, and maze-apps each have a single remote and are unaffected.'
  created: 2026-07-28T14:22:00.897946-05:00
  resolved: 2026-07-28T15:33:04.674250-05:00
