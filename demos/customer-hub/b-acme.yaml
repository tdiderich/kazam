title: "Acme Corp - Overview (B)"
shell: hub
hub:
  name: Acme Corp
  eyebrow: CUSTOMER
  status: Deploying
  status_color: teal
  pages:
    - { label: Overview, href: b-acme.html }
    - { label: Priorities, href: b-priorities.html }
    - { label: Account Plan, href: b-account-plan.html }
    - { label: Deployment, href: b-deployment.html }
    - { label: Notes, href: b-notes.html }
components:
