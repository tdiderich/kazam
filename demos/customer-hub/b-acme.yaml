  - type: card_grid
    cards:
      - title: Priorities
        description: Current asks, open requests, and agenda topics.
        href: b-priorities.html
        badge: { label: 5 open, color: yellow }
      - title: Account Plan
        description: Success plan, milestones, stakeholders, next steps.
        href: b-account-plan.html
      - title: Deployment Tracker
        description: Phase progress, environments, go-live timeline.
        href: b-deployment.html
        badge: { label: phase 2, color: teal }
      - title: Meeting Notes
        description: QBRs, syncs, and debriefs in one stream.
        href: b-notes.html

  - type: event_timeline
    limit: 4
    events:
      - { date: 2026-06-08, title: EKS connector enabled in prod, severity: major }
      - { date: 2026-06-05, title: Weekly sync - auto-closing verification pending, severity: minor }
      - { date: 2026-05-28, title: QBR - expansion to platform team discussed, severity: major }
      - { date: 2026-05-21, title: Phase 2 kickoff, severity: minor }
