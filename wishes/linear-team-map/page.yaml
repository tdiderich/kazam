  - who owns
  - teams
  - projects
  - responsible
freshness:
  updated: "2025-01-01"
  review_every: monthly
  owner: changeme@company.com
  refresh:
    mode: assisted
    steps:
      - run: scripts/fetch-team-map.py
      - prompt: "Read scripts/team-map-prompt.md and scripts/team-map-data.json. Map people to teams and projects. Update this page with current ownership data."
