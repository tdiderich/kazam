  - type: section
    heading: "Sample Team Map"
    components:
      - type: markdown
        body: |
          Below is an example of a populated team ownership map:

          #### Platform Team
          **Lead:** Jane Smith &nbsp; **Members:** 6

          | Member | Role | Active projects |
