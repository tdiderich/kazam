title: kazam
shell: standard

components:
  - type: hero_banner
    title: AI Native Knowledge Management
    eyebrow: kazam
    subtitle: Finally, content that manages itself.
    buttons:
      - label: Get Started
        href: /guide.html
        variant: primary
      - label: GitHub
        href: https://github.com/tdiderich/kazam
        variant: secondary
        external: true

  - type: section
    heading: Sound familiar?
    components:
      - type: before_after
        before_label: "Current"
        after_label: "With kazam"
        items:
          - title: Ownership
            before: Nobody owns the onboarding doc. It was last updated by someone who left six months ago.
            after: Every page declares an owner and review cadence.
            after_context: Stale content shows up in every build.
          - title: Staleness
            before: The API docs say v2 but you shipped v4. A customer files a ticket before anyone notices.
            after: Build-time banners flag overdue content.
            after_context: "`stale.md` tells your agent exactly what to fix."
          - title: Agent access
            before: Your AI agent burns tokens running `find` and `grep` trying to figure out where content lives.
            after: MCP server with five tools.
            after_context: Agents read, search, and write pages directly.
          - title: Toolchain
            before: Node, React, MDX, a build pipeline, three config files, and a prayer.
            after: One Rust binary.
            after_context: "`brew install`, point at a folder, ship HTML."

  - type: section
    heading: See it in action
    components:
      - type: card_grid
        cards:
          - title: Documentation
            description: API refs, guides, onboarding. Tabs, sortable tables, search.
            links:
              - label: See example →
                href: examples/doc.html

          - title: Presentations
            description: Full-viewport slides with keyboard nav. QBRs, strategy decks.
            links:
              - label: See example →
                href: examples/deck.html

          - title: Briefs & agendas
            description: Print-optimized cards. Meeting prep, renewal syncs, 1-pagers.
            links:
              - label: See example →
                href: examples/brief.html

          - title: Live dashboards
            description: Scripts emit data, kazam renders. Customer health, API status.
            links:
              - label: See example →
                href: examples/dashboard.html

  - type: section
    heading: Get started
    components:
      - type: code
        language: bash
        code: |
          brew install tdiderich/tap/kazam
          kazam init my-site && cd my-site && kazam dev .

      - type: markdown
        body: |
          Read the [quickstart guide](/guide.html) or browse the
          [component catalog](/components/index.html).
