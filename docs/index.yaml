title: kazam
shell: standard
nav_layout: top
nav:
  - label: Why
    href: /why.html
  - label: Docs
    href: /guide.html

components:
  - type: hero_banner
    title: AI Native Knowledge Base
    eyebrow: kazam
    subtitle: Structured pages, sidecar annotations, and an MCP server — so your agents can manage your knowledge base the same way your team does.
    buttons:
      - label: Get Started
        href: /guide.html
        variant: primary
      - label: GitHub
        href: https://github.com/tdiderich/kazam
        variant: secondary
        external: true

  - type: section
    heading: Docs rot. Context gets lost. Nobody notices until something breaks.
    align: center
    components:
      - type: card_grid
        cards:
          - title: Ghost ownership
            description: The onboarding guide was last verified by someone who left in Q2.
          - title: Version drift
            description: Your API docs say v2 but you shipped v4 — a customer files a ticket before anyone notices.
          - title: Lost context
            description: Someone mentions a competitive threat on a call. It lives in Granola notes and nowhere else. The customer page never gets updated.
          - title: Agent tax
            description: Your AI agent burns tokens running find and grep trying to figure out where content lives.

  - type: section
    heading: Sound familiar?
    align: center
    components:
      - type: split_compare
        left:
          eyebrow: TODAY
          title: Nobody owns the onboarding doc
          stats:
            - label: Last verified
              value: 6 months ago
              color: red
            - label: Owner
              value: "someone who left"
              color: red
            - label: Review cadence
              value: none
              color: yellow
            - label: Staleness detection
              value: hope-based
              color: red
        right:
          eyebrow: WITH KAZAM
          title: Freshness is a first-class primitive
          stats:
            - label: Last verified
              value: build-time check
              color: green
            - label: Owner
              value: declared per page
              color: green
            - label: Review cadence
              value: 30d / 90d / quarterly
              color: green
            - label: Staleness detection
              value: deterministic
              color: teal

  - type: section
    heading: Annotations close the loop
    align: center
    components:
      - type: markdown
        body: |
          Drop context from a call, a Slack thread, or your own notes — right onto the page that matters.
          Annotations live as sidecar files, not embedded in content. When an agent refreshes the page,
          it reads your annotations first and incorporates what's relevant.

      - type: split_compare
        left:
          eyebrow: YOU ANNOTATE
          title: "kazam annotate customers/acme.yaml"
          stats:
            - label: Context
              value: "evaluating Wiz"
              color: yellow
            - label: Section
              value: competitive
              color: default
            - label: Source
              value: customer call
              color: default
        right:
          eyebrow: AGENT REFRESHES
          title: Annotations drive the update
          stats:
            - label: Priority
              value: annotations first
              color: green
            - label: Resolution
              value: overrides stale CRM data
              color: green
            - label: After refresh
              value: marked incorporated
              color: teal

  - type: section
    heading: See it in action
    align: center
    components:
      - type: card_grid
        cards:
          - title: Documentation
            description: API refs, guides, onboarding. Tabs, sortable tables, search.
            links:
              - label: See example →
                href: examples/doc.html

          - title: Presentations
            description: Full-viewport slides with keyboard nav. QBRs, strategy decks.
            links:
              - label: See example →
                href: examples/deck.html

          - title: Briefs & agendas
            description: Print-optimized cards. Meeting prep, renewal syncs, 1-pagers.
            links:
              - label: See example →
                href: examples/brief.html

          - title: Live dashboards
            description: Scripts emit data, kazam renders. Customer health, API status.
            links:
              - label: See example →
                href: examples/dashboard.html

  - type: section
    heading: Built for your role
    align: center
    components:
      - type: card_grid
        cards:
          - title: Engineering lead
            description: See which onboarding docs are rotting and who owns them. Manage knowledge debt like tech debt.
          - title: Ops / People lead
            description: Track owners and review dates across 50+ policy docs. Know what's stale every Monday morning.
          - title: Product / GTM lead
            description: Keep sales decks, one-pagers, and competitive docs current. Know when a renewal brief is out of date.
          - title: Technical founder
            description: Ship a knowledge base your AI agents can actually read — MCP server, structured YAML, no scraping.

  - type: section
    align: center
    components:
      - type: callout
        variant: info
        title: Get started
        body: One binary, zero dependencies. Install via Homebrew or Cargo and start building in seconds.
        links:
          - label: Quickstart guide
            href: /guide.html
            variant: primary
          - label: Component catalog
            href: /components/index.html
            variant: secondary
          - label: GitHub
            href: https://github.com/tdiderich/kazam
            variant: secondary
