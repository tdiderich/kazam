title: kazam
shell: standard

components:
  - type: hero_banner
    title: AI Native Knowledge Management
    eyebrow: kazam
    subtitle: Finally, content that manages itself.
    buttons:
      - label: Get Started
        href: /guide.html
        variant: primary
      - label: GitHub
        href: https://github.com/tdiderich/kazam
        variant: secondary
        external: true

  - type: section
    heading: Built for your role
    components:
      - type: columns
        equal_heights: true
        columns:
          - - type: callout
              variant: info
              title: Engineering lead
              body: "Your team just hit 30 and the onboarding guide was last verified by someone who left in Q2. kazam gives you a health dashboard that shows exactly which docs are decaying and who owns them — so you manage knowledge debt the same way you manage tech debt."
          - - type: callout
              variant: info
              title: Ops / People lead
              body: "You maintain 50 policy docs and have no idea which ones are still current. kazam tracks owners and review cadence per page, then generates a stale report every build. Monday morning, you know exactly what needs a refresh."
          - - type: callout
              variant: info
              title: Technical founder
              body: "You're building an AI-native company and your agents can't read your wiki. kazam ships a native MCP server — your coding agents get structured access to your knowledge base instead of scraping HTML and guessing at structure."

  - type: section
    heading: Sound familiar?
    components:
      - type: split_compare
        left:
          eyebrow: TODAY
          title: Nobody owns the onboarding doc
          stats:
            - label: Last verified
              value: 6 months ago
              color: red
            - label: Owner
              value: "someone who left"
              color: red
            - label: Review cadence
              value: none
              color: yellow
            - label: Staleness detection
              value: hope-based
              color: red
        right:
          eyebrow: WITH KAZAM
          title: Freshness is a first-class primitive
          stats:
            - label: Last verified
              value: build-time check
              color: green
            - label: Owner
              value: declared per page
              color: green
            - label: Review cadence
              value: 30d / 90d / quarterly
              color: green
            - label: Staleness detection
              value: deterministic
              color: teal

  - type: section
    heading: See it in action
    components:
      - type: card_grid
        cards:
          - title: Documentation
            description: API refs, guides, onboarding. Tabs, sortable tables, search.
            links:
              - label: See example →
                href: examples/doc.html

          - title: Presentations
            description: Full-viewport slides with keyboard nav. QBRs, strategy decks.
            links:
              - label: See example →
                href: examples/deck.html

          - title: Briefs & agendas
            description: Print-optimized cards. Meeting prep, renewal syncs, 1-pagers.
            links:
              - label: See example →
                href: examples/brief.html

          - title: Live dashboards
            description: Scripts emit data, kazam renders. Customer health, API status.
            links:
              - label: See example →
                href: examples/dashboard.html

  - type: section
    heading: Audit your docs in 30 seconds
    components:
      - type: markdown
        body: |
          Already have a kazam site? Run `freshness show` to see what's stale
          right now — no build needed.

      - type: code
        language: bash
        code: |
          kazam freshness show path/to/site

      - type: markdown
        body: |
          You'll get a list of every overdue and due-soon page, grouped by owner.
          Hand the output to your agent or use it to prioritize your next review cycle.

  - type: section
    heading: Get started
    components:
      - type: code
        language: bash
        code: |
          brew install tdiderich/tap/kazam
          kazam init my-site && cd my-site && kazam dev .

      - type: markdown
        body: |
          Read the [quickstart guide](/guide.html) or browse the
          [component catalog](/components/index.html).
