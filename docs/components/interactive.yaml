title: Interactive components
shell: standard

components:
  - type: breadcrumb
    items:
      - label: Home
        href: ../index.html
      - label: Components
        href: index.html
      - label: Interactive

  - type: header
    title: Interactive components
    eyebrow: Reference
    subtitle: table, tabs, accordion, call_log, sequence

  # ── table ─────────────────────────────────
  - type: section
    eyebrow: table
    heading: Sortable, filterable tables
    components:
      - type: markdown
        body: |
          Client-side sortable (per-column) and filterable (row-level text search).
          `sortable: true` on a column enables the click-to-sort affordance; `filterable: true`
          on the table adds a search box above.

          Rows are a list of maps keyed by column `key`. Sort tries numeric parsing first
          (stripping `$`, `%`, `,`) then falls back to string compare.

          A cell written as `{ value: Healthy, status: green }` draws a status dot before
          its value. Sorting, filtering and `summary` read the value.

      - type: table
        filterable: true
        columns:
          - key: customer
            label: Customer
            sortable: true
          - key: acv
            label: ACV
            sortable: true
            align: right
          - key: stage
            label: Stage
            sortable: true
          - key: close
            label: Close date
          - key: health
            label: Health
        rows:
          - customer: Acme Corp
            acv: $480,000
            stage: Closed Won
            close: 2026-04-15
            health: { value: Healthy, status: green }
          - customer: Beta Corp
            acv: $120,000
            stage: Negotiation
            close: 2026-05-30
            health: { value: At risk, status: yellow }
          - customer: Gamma Inc
            acv: $850,000
            stage: Discovery
            close: 2026-07-10
            health: { value: Healthy, status: green }
          - customer: Delta Labs
            acv: $45,000
            stage: Closed Won
            close: 2026-03-01
            health: { value: Churn risk, status: red }

      - type: code
        language: yaml
        code: |
          - type: table
            filterable: true
            columns:
              - key: customer
                label: Customer
                sortable: true
              - key: acv
                label: ACV
                sortable: true
                align: right     # left | right | center
            rows:
              - customer: Acme Corp
                acv: $480,000
              - customer: Beta Corp
                acv: $120,000

  # ── tabs ──────────────────────────────────
  - type: section
    eyebrow: tabs
    heading: Tabbed panels
    components:
      - type: markdown
        body: "Progressive disclosure. Tab labels as buttons, panels below. First tab shows by default. Each tab's `components:` can contain anything - including nested tabs or accordions."

      - type: tabs
        tabs:
          - label: Summary
            components:
              - type: markdown
                body: "High-level pitch lives here."

          - label: Details
            components:
              - type: stat_grid
                columns: 2
                stats:
                  - label: Built in
                    value: 1 day
                    color: green
                  - label: Lines of code
                    value: "~2,200"
                    color: default

          - label: FAQ
            components:
              - type: accordion
                items:
                  - title: Can tabs contain other components?
                    components:
                      - type: markdown
                        body: Yes - any component, including accordions like this one.
                  - title: What about nested tabs?
                    components:
                      - type: markdown
                        body: Also supported, but usually a sign you should split pages.

      - type: code
        language: yaml
        code: |
          - type: tabs
            tabs:
              - label: Summary
                components:
                  - type: markdown
                    body: "High-level pitch lives here."
              - label: Details
                components:
                  - type: stat_grid
                    stats: [...]

  # ── sequence ──────────────────────────────
  - type: section
    eyebrow: sequence
    heading: Guided walkthrough of another component
    components:
      - type: markdown
        body: |
          A strip of steps that points at a `target` component by `id`. Each step lists the `id`s to bring forward; everything else with an `id` inside the target dims, and a box that contains a highlighted cell stays clear so it reads as context. Arrow keys or `[` / `]` step when the strip has focus, Escape or **Show all** clears it. Validation errors when `target` or any `highlight` id is not an explicit `id:` on this page. Hidden in print and export.

      - type: grid
        id: seq-demo
        columns: 3
        gap: 10
        children:
          - component: { type: box, id: seq-a, title: Ingest, body: Read the source at one commit. }
          - component: { type: box, id: seq-b, title: Match, body: Candidates from rules and advisories. }
          - component: { type: box, id: seq-c, title: Decide, border: dashed, body: An agent reads the path and rules. }

      - type: sequence
        target: seq-demo
        steps:
          - highlight: [seq-a]
            note: "**Ingest.** One commit, one SBOM."
          - highlight: [seq-b]
            note: "**Match.** Recall first, so nothing is missed."
          - highlight: [seq-c]
            note: "**Decide.** Precision comes from reading, not from the rule."

      - type: code
        language: yaml
        code: |
          - type: grid
            id: seq-demo
            columns: 3
            children:
              - component: { type: box, id: seq-a, title: Ingest, body: "..." }
              - component: { type: box, id: seq-b, title: Match, body: "..." }
          - type: sequence
            target: seq-demo
            steps:
              - highlight: [seq-a]
                note: "**Ingest.** One commit, one SBOM."
              - highlight: [seq-b]
                note: "**Match.** Recall first."

  # ── accordion ─────────────────────────────
  - type: section
    eyebrow: accordion
    heading: Collapsible sections
    components:
      - type: markdown
        body: "Click-to-expand sections. All closed by default. Each item contains any components."

      - type: accordion
        items:
          - title: What if I need a component that doesn't exist yet?
            components:
              - type: markdown
                body: |
                  Open an issue or add it - each component is ~30 lines of Rust
                  plus CSS. See `src/render/components.rs` for the pattern.

          - title: Can I theme the colors?
            components:
              - type: markdown
                body: |
                  Yes - pick `dark` or `light` as the base via the `theme:` key
                  in `kazam.yaml`, and override any individual token with a
                  `colors:` map. See the [Theming section of the guide](../guide.html).

          - title: Does it work without a server?
            components:
              - type: markdown
                body: |
                  Yes - `kazam build` produces plain HTML files. Open them
                  directly with `file://` URLs. Nav and interactive components
                  all work locally.

      - type: code
        language: yaml
        code: |
          - type: accordion
            items:
              - title: Question 1
                components:
                  - type: markdown
                    body: Answer content.
              - title: Question 2
                components:
                  - type: markdown
                    body: Answer content.

  # ── call_log ──────────────────────────────
  - type: section
    eyebrow: call_log
    heading: Customer call history
    components:
      - type: markdown
        body: |
          One bordered card per call, newest first (sorted by `date`, whatever the YAML order).
          Each card is a head row with the date, title and an optional one-line `summary`;
          click it to open that call's agenda and notes. One card is open at a time. Only
          the first `limit` (default 5) show, then "Show N more" reveals the next `limit`.
          A call with no `components` is a plain row. `#call-<date>` in the URL opens that
          call (`-2`, `-3` for same-date duplicates). No items shows "No calls yet."

      - type: call_log
        limit: 2
        items:
          - date: "2026-11-04"
            title: Path to production
            summary: Agreed the Jira rollout, EKS still blocked
            components:
              - type: markdown
                body: |
                  **Agenda**
                  - Jira rollout plan
                  - EKS blocker
          - date: "2026-10-14"
            title: Exec sync
            summary: Renewal timing and roadmap
            components:
              - type: markdown
                body: "Walked the roadmap. Renewal review booked."
          - date: "2026-09-22"
            title: Kickoff

      - type: code
        language: yaml
        code: |
          - type: call_log
            limit: 5                      # optional, default 5
            items:
              - date: "2026-11-04"        # required, YYYY-MM-DD
                title: Path to production # required
                summary: One line         # optional
                components:               # optional; agenda + notes
                  - type: markdown
                    body: Notes.

  - type: callout
    variant: info
    title: Next up
    body: Layout components are the skeleton every page hangs on - sections, columns, dividers, timelines, steps.
    links:
      - label: Layout
        href: layout.html
        variant: primary
      - label: All components
        href: index.html
        variant: secondary
