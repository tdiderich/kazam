# Two to four stages, at most five capabilities each. inputs/outputs are
# short nouns. context is optional and takes 22% of the height.
- type: pipeline
  title: Code analysis
  height: 380
  inputs:
    - { label: Repository, detail: One commit }
    - { label: Lockfiles }
  stages:
    - label: Inventory
      detail: Repeatable
      capabilities:
        - { label: SBOM }
        - { label: Dependency graph }
        - { label: First-party tagging, dim: true }
    - label: Detect
      detail: Repeatable
      capabilities:
        - { label: SCA match }
        - { label: SAST rules }
        - { label: AI SAST }
    - label: Investigate
      detail: Model-driven
      capabilities:
        - { label: Reachability }
        - { label: Exploitability }
        - { label: Impact }
  outputs:
    - { label: Exploitable, color: red }
    - { label: Not exploitable, color: green }
  context:
    - { label: Advisory mirror }
    - { label: Static call graph }
